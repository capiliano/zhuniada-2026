<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Juegos | ZHUNIADA 2026</title>

<link rel="icon" type="image/png" href="imagenes/icono.png">

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #080b09;
    color: white;
}

header {
    max-width: 1100px;
    margin: auto;
    padding: 25px;
}

header a {
    color: #aaa;
    text-decoration: none;
    font-size: 15px;
    transition: color .3s;
}

header a:hover {
    color: white;
}

.container {
    max-width: 1100px;
    margin: auto;
    padding: 40px 20px 80px;
}

h1 {
    font-size: clamp(35px, 6vw, 65px);
    line-height: 1.05;
    margin-bottom: 15px;
}

.subtitle {
    color: #999;
    font-size: 17px;
    margin-bottom: 45px;
}

.videos {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 25px;
}

.video {
    background: #121613;
    border-radius: 18px;
    overflow: hidden;
    border: 1px solid #222;

    box-shadow:
        0 10px 30px rgba(0,0,0,.25);
}

iframe {
    width: 100%;
    aspect-ratio: 16 / 9;
    border: 0;
    display: block;
}

.info {
    padding: 20px;
}

.info h2 {
    font-size: 21px;
    margin-bottom: 8px;
}

.info p {
    color: #888;
    font-size: 14px;
}

@media(max-width:700px) {

    .container {
        padding: 30px 15px 60px;
    }

    .videos {
        grid-template-columns: 1fr;
    }

    h1 {
        font-size: 40px;
    }

}

</style>

</head>


<body>


<!-- =========================
     CABECERA
========================= -->

<header>

<a href="index.html">
    ← Volver a ZHUNIADA 2026
</a>

</header>


<!-- =========================
     CONTENIDO
========================= -->

<main class="container">

    <h1>
        Juegos
    </h1>

    <p class="subtitle">
        Revive los juegos y momentos
        de diversión de ZHUNIADA 2026.
    </p>


    <div class="videos">


        <!-- =====================
             VIDEO 1
        ====================== -->

        <div class="video">

            <iframe
                src="https://www.youtube.com/embed/VIDEO_ID"
                title="Juegos ZHUNIADA 2026"
                loading="lazy"
                allow="
                    accelerometer;
                    autoplay;
                    clipboard-write;
                    encrypted-media;
                    gyroscope;
                    picture-in-picture;
                    web-share
                "
                allowfullscreen>
            </iframe>

            <div class="info">

                <h2>
                    Juegos de ZHUNIADA 2026
                </h2>

                <p>
                    Gualaquiza · Ecuador
                </p>

            </div>

        </div>


    </div>

</main>


</body>

</html>
