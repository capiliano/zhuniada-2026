<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Madrina | ZHUNIADA 2026</title>


<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}


body {

    font-family: Arial, Helvetica, sans-serif;

    background: #080b09;

    color: white;

}


/* =========================
   CABECERA
========================= */

header {

    max-width: 1150px;

    margin: auto;

    padding: 25px 20px;

}


.back {

    color: #aaa;

    text-decoration: none;

    font-size: 15px;

    transition: color .3s;

}


.back:hover {

    color: white;

}


/* =========================
   CONTENIDO
========================= */

.container {

    max-width: 1150px;

    margin: auto;

    padding: 35px 20px 80px;

}


h1 {

    font-size:
        clamp(38px, 6vw, 70px);

    line-height: 1.05;

    margin-bottom: 15px;

}


.subtitle {

    color: #999;

    font-size: 17px;

    margin-bottom: 50px;

}


/* =========================
   VIDEOS
========================= */

.videos {

    display: grid;

    grid-template-columns:
        repeat(2, 1fr);

    gap: 28px;

}


.video {

    background: #121613;

    border-radius: 20px;

    overflow: hidden;

    border: 1px solid #222;

    box-shadow:
        0 10px 30px rgba(0,0,0,.25);

}


.video iframe {

    width: 100%;

    aspect-ratio: 16 / 9;

    border: 0;

    display: block;

}


.info {

    padding: 22px;

}


.info h2 {

    font-size: 21px;

    margin-bottom: 8px;

}


.info p {

    color: #888;

    font-size: 14px;

}


/* =========================
   CELULAR
========================= */

@media(max-width:700px) {

    .container {

        padding:
            30px 15px 60px;

    }


    .videos {

        grid-template-columns: 1fr;

    }


    h1 {

        font-size: 40px;

    }

}

</style>

</head>


<body>


<!-- =========================
     BOTÓN VOLVER
========================= -->

<header>

<a
    class="back"
    href="index.html"
>
    ← Volver a ZHUNIADA 2026
</a>

</header>



<!-- =========================
     CONTENIDO
========================= -->

<main class="container">


    <h1>
        Madrina
    </h1>


    <p class="subtitle">

        Revive los momentos de la elección
        y conoce las declaraciones de la
        nueva madrina de ZHUNIADA 2026.

    </p>



    <div class="videos">


        <!-- =====================
             VIDEO 1
        ====================== -->

        <article class="video">


            <iframe

                src="https://www.youtube.com/embed/xuhjKY276Vg"

                title="Sorteo de la nueva madrina - ZHUNIADA 2026"

                loading="lazy"

                allow="
                    accelerometer;
                    autoplay;
                    clipboard-write;
                    encrypted-media;
                    gyroscope;
                    picture-in-picture;
                    web-share
                "

                allowfullscreen>

            </iframe>


            <div class="info">

                <h2>
                    Sorteo de la nueva madrina
                </h2>


                <p>
                    ZHUNIADA 2026 · Gualaquiza
                </p>

            </div>


        </article>



        <!-- =====================
             VIDEO 2
        ====================== -->

        <article class="video">


            <iframe

                src="https://www.youtube.com/embed/JKG341Twj8o"

                title="Declaraciones de la nueva madrina - ZHUNIADA 2026"

                loading="lazy"

                allow="
                    accelerometer;
                    autoplay;
                    clipboard-write;
                    encrypted-media;
                    gyroscope;
                    picture-in-picture;
                    web-share
                "

                allowfullscreen>

            </iframe>


            <div class="info">

                <h2>
                    Declaraciones de la nueva madrina
                </h2>


                <p>
                    ZHUNIADA 2026 · Gualaquiza
                </p>

            </div>


        </article>


    </div>


</main>


</body>

</html>
